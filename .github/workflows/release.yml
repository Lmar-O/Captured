name: Release

# Builds the universal DMG on a macOS runner and attaches it to the release
# for the tag being built. Push a tag (`git tag v1.1.0 && git push origin
# v1.1.0`) or run this manually against a tag that has no published release
# yet — see the Publish step for why an existing one cannot be topped up.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build universal DMG
        run: npm run dist
        env:
          # No Developer ID in CI. electron-builder would otherwise hunt the
          # keychain for a certificate and fail the build; build/after-pack.js
          # ad-hoc signs the bundle instead, which is what makes it runnable
          # on Apple Silicon.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the signature survived packaging
        run: |
          APP="dist/mac-universal/Captured.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'Identifier=com.captured.app'
          lipo -archs "$APP/Contents/MacOS/Captured"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # This repo has immutable releases turned on, which freezes a
          # release's assets the moment it is published. Creating the release
          # and *then* uploading — which is what this step used to do — fails
          # with "422 Cannot upload assets to an immutable release", leaving a
          # release with nothing but GitHub's auto-generated source archives.
          #
          # Handing the DMG to `gh release create` avoids that: given assets,
          # gh creates the release as a draft, uploads them, and only then
          # publishes it. A draft is still mutable, so the DMG lands before
          # immutability takes effect.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            # A draft left behind by an earlier run: still mutable, so finish it.
            gh release upload "$TAG" dist/*.dmg --clobber
            gh release edit "$TAG" --draft=false
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published and immutable — its" \
                 "assets are frozen and the tag name cannot be reused." \
                 "Bump the version and cut a new tag."
            exit 1
          else
            gh release create "$TAG" \
              --title "Captured ${TAG#v}" \
              --notes-file .github/RELEASE_NOTES.md \
              dist/*.dmg
          fi
